name: Build & Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Artifacts & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci --ignore-scripts
          node scripts/postinstall.js

      - name: Build Backend (NestJS)
        run: |
          npm run build

      - name: Build Frontend (Dashboard)
        run: |
          npm run dashboard:build

      - name: Package Build Artifacts
        run: |
          mkdir -p release-package/dashboard
          cp -r dist release-package/
          cp -r dashboard/dist release-package/dashboard/dist
          cp -r scripts release-package/
          cp package.json package-lock.json release-package/
          cp .env.minimal release-package/.env.example
          
          # Create a deployment archive
          tar -czf openwa-build-artifacts.tar.gz -C release-package .

      - name: Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create Remote Deployment Directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p /opt/openwa/data /opt/openwa/releases"

      - name: Upload Artifacts to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -P "$VPS_PORT" openwa-build-artifacts.tar.gz "$VPS_USER@$VPS_HOST":/opt/openwa/releases/openwa-build-artifacts.tar.gz

      - name: Execute Deployment on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'bash -s' << 'EOF'
            set -e

            # Source user environments so node, npm, nvm are available in non-interactive SSH
            [ -s "$HOME/.nvm/nvm.sh" ] && source "$HOME/.nvm/nvm.sh"
            [ -s "$HOME/.profile" ] && source "$HOME/.profile"
            [ -s "$HOME/.bashrc" ] && source "$HOME/.bashrc"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.local/bin

            # Check if Node.js is installed on VPS, install if missing
            if ! command -v node > /dev/null 2>&1; then
              echo "⚠️ Node.js not detected. Installing Node.js 22 LTS..."
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs build-essential
            fi

            echo "Using Node version: $(node -v) and NPM: $(npm -v)"

            cd /opt/openwa

            echo "📦 Extracting new release artifacts..."
            tar -xzf releases/openwa-build-artifacts.tar.gz -C /opt/openwa/

            # Create default .env if it does not exist
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "✅ Created initial .env configuration"
            fi

            echo "📥 Cleaning previous node_modules and installing production dependencies..."
            rm -rf node_modules
            npm ci --omit=dev --ignore-scripts
            node scripts/postinstall.js

            echo "🌐 Installing Chrome for Puppeteer..."
            npx puppeteer browsers install chrome

            echo "🔄 Managing OpenWA process via PM2..."
            if ! command -v pm2 > /dev/null 2>&1; then
              echo "Installing PM2 globally..."
              npm install -g pm2
            fi

            # Restart or start application with PM2
            pm2 describe openwa > /dev/null 2>&1 && pm2 restart openwa || pm2 start dist/main.js --name openwa --time
            pm2 save

            echo "📊 PM2 Process Status:"
            pm2 status openwa

            echo "🎉 Deployment completed successfully!"
          EOF
