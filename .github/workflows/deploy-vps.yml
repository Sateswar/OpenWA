name: Build & Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Artifacts & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci --ignore-scripts
          node scripts/postinstall.js

      - name: Build Backend (NestJS)
        run: |
          npm run build

      - name: Build Frontend (Dashboard)
        run: |
          npm run dashboard:build

      - name: Package Build Artifacts
        run: |
          mkdir -p release-package
          cp -r dist release-package/
          cp -r dashboard/dist release-package/dashboard-dist
          cp -r scripts release-package/
          cp package.json package-lock.json release-package/
          cp .env.minimal release-package/.env.example
          
          # Create a deployment archive
          tar -czf openwa-build-artifacts.tar.gz -C release-package .

      - name: Configure SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create Remote Deployment Directory
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p /opt/openwa/data /opt/openwa/releases /opt/openwa/dashboard"

      - name: Upload Artifacts to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -P "$VPS_PORT" openwa-build-artifacts.tar.gz "$VPS_USER@$VPS_HOST":/opt/openwa/releases/openwa-build-artifacts.tar.gz

      - name: Execute Deployment on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" << 'EOF'
            set -e
            cd /opt/openwa

            echo "📦 Extracting new release artifacts..."
            tar -xzf releases/openwa-build-artifacts.tar.gz -C /opt/openwa/

            # Ensure dashboard/dist folder structure is mapped
            mkdir -p dashboard
            cp -r dashboard-dist/* dashboard/dist/ 2>/dev/null || cp -r dashboard-dist dashboard/dist

            # Copy default .env if it does not exist
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "Created initial .env configuration"
            fi

            echo "📥 Installing production dependencies..."
            npm ci --omit=dev --ignore-scripts
            node scripts/postinstall.js

            echo "🌐 Installing Chrome for Puppeteer if needed..."
            npx puppeteer browsers install chrome

            echo "🔄 Restarting OpenWA service via PM2..."
            if command -v pm2 > /dev/null; then
              pm2 describe openwa > /dev/null 2>&1 && pm2 restart openwa || pm2 start dist/main.js --name openwa
              pm2 save
            else
              echo "PM2 not found. Installing PM2 globally..."
              npm install -g pm2
              pm2 start dist/main.js --name openwa
              pm2 save
              pm2 startup || true
            fi

            echo "✅ Deployment completed successfully!"
          EOF
